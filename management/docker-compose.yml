services:
  prometheus:
    env_file:
      - ../.env
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    network_mode: host                                     # 访问 tailscale0 抓取节点
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.listen-address=127.0.0.1:4230'
      # Alertmanager/Prometheus derive the served route prefix from the path of
      # external-url. Forcing route-prefix=/ made every /prometheus/* request
      # 404 behind the prefix-preserving nginx location.
      - '--web.external-url=${PROMETHEUS_EXTERNAL_URL:-http://localhost/prometheus}'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus

  grafana:
    env_file:
      - ../.env
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    network_mode: host                                     # 与 Prometheus 同一网络栈，直接 localhost:4230
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_PORT=4231                           # host 模式下用此代替 ports 映射
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-https://example.com/grafana}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_FEATURE_TOGGLES_ENABLE=publicDashboards        # 开启公开 Dashboard 分享
      - GF_SECURITY_ALLOW_EMBEDDING=true                 # 允许 iframe 嵌入（status page 使用）
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

  alertmanager:
    env_file:
      - ../.env
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    network_mode: host
    # Alertmanager does not expand environment variables in its YAML, and the
    # image does not ship envsubst. Render the webhook URL into a temporary copy
    # before starting; mounting the template directly failed with "invalid URL".
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        url="$${ALERTMANAGER_WEBHOOK_URL:-http://localhost:9999/alert}"
        escaped=$$(printf '%s' "$$url" | sed 's/[&|\\]/\\&/g')
        sed "s|__ALERTMANAGER_WEBHOOK_URL__|$$escaped|g" /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml
        exec /bin/alertmanager \
          --config.file=/tmp/alertmanager.yml \
          --web.listen-address=127.0.0.1:9093 \
          --web.external-url="$${ALERTMANAGER_EXTERNAL_URL:-http://localhost/alertmanager}" \
          --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
