name: Sync to Gitea

on:
  push:
    branches: [main, deploy/k8s]
    tags: ['*']

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitea
        run: |
          git remote add gitea https://SakuraPuare:${{ secrets.GITEA_TOKEN }}@gitea.sakurapuare.com/SakuraPuare/Hive.git
          git push gitea HEAD:${{ github.ref_name }} --force-with-lease
          git push gitea --tags
