name: Sync from Gitea

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-from-gitea
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch canonical refs from Gitea
        run: |
          git remote add gitea https://gitea.sakurapuare.com/SakuraPuare/Hive.git
          git fetch --prune gitea \
            +refs/heads/main:refs/remotes/gitea/main \
            +refs/heads/deploy/k8s:refs/remotes/gitea/deploy/k8s \
            +refs/tags/*:refs/tags/*

      - name: Update canonical refs on GitHub
        run: |
          # Explicit refspecs intentionally leave Renovate/other PR branches alone.
          git push origin \
            +refs/remotes/gitea/main:refs/heads/main \
            +refs/remotes/gitea/deploy/k8s:refs/heads/deploy/k8s \
            'refs/tags/*:refs/tags/*'
