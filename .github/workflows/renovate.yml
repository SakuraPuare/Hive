name: Renovate

# 手动触发一次 Renovate。
# 仓库里没有 renovate.json：日常由自建实例在 02:20 Asia/Shanghai 跑；本 workflow
# 只提供「立刻跑一次」的按钮，策略在 .github/renovate-workflow.json（文件名不在
# Renovate 的默认发现列表里，因此不会影响自建实例的配置）。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只做 lookup（不建分支/PR）"
        type: boolean
        default: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Renovate 只管理 token 用户自己创建的 issue/PR。定时实例的 token 属于
      # SakuraPuare（Dependency Dashboard #31 的作者），本 workflow 也必须用同一
      # 身份的 token，否则会另建一个 dashboard、并让定时实例看不到这里开的 PR。
      - name: Check token identity
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          login=$(curl -fsS -H "Authorization: Bearer $RENOVATE_TOKEN" https://api.github.com/user | jq -r .login)
          if [ "$login" != "SakuraPuare" ]; then
            echo "::error::RENOVATE_TOKEN belongs to '$login'; it must belong to 'SakuraPuare' (same identity as the scheduled Renovate instance), otherwise this run creates a duplicate Dependency Dashboard and PRs the scheduled instance cannot manage."
            exit 1
          fi

      - name: Enable dry run
        if: inputs.dry_run
        run: echo "RENOVATE_DRY_RUN=lookup" >> "$GITHUB_ENV"

      - name: Run Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          configurationFile: .github/renovate-workflow.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: info
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: "false"
