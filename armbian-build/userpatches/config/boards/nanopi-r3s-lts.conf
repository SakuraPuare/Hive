# Extend upstream Armbian's LTS board; retain its DT, port names and LED hooks.
# The upstream v2026.04 patch set supplies the LTS defconfig and device tree.
function post_family_config__zz_hive_r3s_lts_bootloader() {
    [[ "$BRANCH" == current ]] || exit_with_error "Hive R3S LTS requires the current branch"
    [[ "$BOOTCONFIG" == nanopi-r3s-lts-rk3566_defconfig && "$BOOTBRANCH" == tag:v2026.04 ]] ||
        exit_with_error "Hive R3S LTS requires the upstream v2026.04 LTS bootloader"
    declare -g BOOTPATCHDIR="${BOOTPATCHDIR} hive-v2026.07"
    if [[ "${HIVE_AB:-no}" == yes ]]; then
        # Firmware payloads live inside the single root filesystem, not /boot
        # on a separate partition. The factory converter reserves 16 MiB.
        declare -g BOOTSIZE=0
        declare -g BOOTFS_TYPE=""
    fi
}

source "${USERPATCHES_PATH}/config/hive-bootab.inc"
