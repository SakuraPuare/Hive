# Hive overlay for Orange Pi 4 LTS. Upstream config/boards/orangepi4-lts.conf
# already selects U-Boot v2026.10, TF-A lts-v2.14.11 and the YT8531C device
# tree. Do not copy that file here, and do not append the hive-v2026.07
# pylibfdt patch: v2026.10 already uses the Python 3 APIs that patch fixed.
#
# BOOTBRANCH is filled from BOOTBRANCH_BOARD in late_family_config, after
# post_family_config. Check the resolved tag here.
function late_family_config__zz_hive_opi4_bootloader() {
    [[ "$BRANCH" == current ]] || exit_with_error "Hive Orange Pi 4 LTS requires the current branch"
    [[ "$BOOTCONFIG" == orangepi-4-lts-rk3399_defconfig && "$BOOTBRANCH" == tag:v2026.10 ]] ||
        exit_with_error "Hive Orange Pi 4 LTS requires U-Boot tag:v2026.10 and orangepi-4-lts-rk3399_defconfig (got BOOTBRANCH='${BOOTBRANCH}' BOOTCONFIG='${BOOTCONFIG}')"
    [[ "$BOOT_SCENARIO" == binman-atf-mainline ]] ||
        exit_with_error "Hive Orange Pi 4 LTS requires binman-atf-mainline (got '${BOOT_SCENARIO}')"
    if [[ "${HIVE_AB:-no}" == yes ]]; then
        # Payloads live in the single root filesystem. The factory image
        # reserves the first 16 MiB for GPT, U-Boot and the redundant environment.
        # Boot from microSD. The onboard eMMC still fails to initialise.
        declare -g BOOTSIZE=0
        declare -g BOOTFS_TYPE=""
    fi
}

source "${USERPATCHES_PATH}/config/hive-bootab.inc"
