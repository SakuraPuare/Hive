# Hive Gateway (透明代理网关) - 内置兜底配置
# 作用：hive-clash-sync 还没从 registry 拉到真配置前，Mihomo 也能启动不崩。
# 一旦同步成功，本文件会被 registry 下发的完整配置整体覆盖。请勿手改。

mixed-port: 7890
allow-lan: true
mode: Rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true

# 局域网可视化面板（MetaCubeXD）：external-controller 监听全网段。
# 兜底 secret 占位，真配置下发后由节点 MAC 派生覆盖。
external-controller: 0.0.0.0:9090
secret: "hive-gateway"
external-ui: "/var/www/metacubexd"
external-ui-name: metacubexd

profile:
  store-selected: true
  store-fake-ip: true

# TPROXY（只接管 LAN/AP 转发流量）：
# 本机自身出站不进 tproxy，Xray 出口/registry/cloudflared 等控制面天然直连。
# nft 规则与 fwmark ip rule 由 hive-gateway-route.service 安装。
tproxy-port: 7893

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # tailscaled 绑定物理网卡地址直连控制面，fake-IP 会让它 SYN 黑洞。
  fake-ip-filter:
    - '+.tailscale.com'
    - '+.tailscale.io'
  nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query

proxies:
  - name: "直连"
    type: direct
    udp: true

proxy-groups:
  - name: 代理
    type: select
    proxies: [直连]

# No customer traffic before a valid subscription is received.
# 节点自身的控制面必须放行：auto-route 把本机出站也送进 TUN，源地址是 TUN 地址；
# mihomo 在本机实测匹配不到进程名（find-process-mode=always 亦然），只靠
# PROCESS-NAME 会让节点连注册/拉配置都做不到（fail-closed 自锁）。
rules:
  - SRC-IP-CIDR,198.18.0.1/32,DIRECT
  - SRC-IP-CIDR,fdfe:dcba:9876::1/128,DIRECT
  - PROCESS-NAME,curl,DIRECT
  - MATCH,REJECT
