# Root shell is key-only. LAN, hotspot and serial have no password to try.
# AuthenticationMethods is the backstop if a later drop-in turns password auth back on.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
