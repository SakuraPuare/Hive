# RK3528 片上 DesignWare 看门狗。内核基线自带 CONFIG_WATCHDOG=y 与
# CONFIG_DW_WATCHDOG=y，主线 rk3528.dtsi 也有 watchdog@ffac0000 节点
# （compatible 含 snps,dw-wdt），但仓库此前没有任何用户态使用者，等于
# SoC 级的复位能力一直闲置。
#
# PID 1 打开 /dev/watchdog0 并按超时一半的间隔喂狗：systemd 主进程死锁、
# 被 SIGSTOP，或调度被饿死时，30 秒后由 SoC 硬复位，不依赖内核仍能跑代码。
# 这补齐 boot.cmd 的 panic=10 覆盖不到的那一段——panic 需要内核还活着。
#
# 30 秒是保守下限：超时的一半即喂狗间隔，若取值太小，开机阶段一次长阻塞
# （fsck、慢介质 probe）就会变成误复位。nowayout 保持内核默认 n，理由是
# 未见真机验证：一旦设 y，armed 后无法 disarm，重启路径异常时会变成
# 复位循环。真机确认 `systemctl reboot` 与 `poweroff` 都干净之后再考虑收紧。
#
# 注意这里没有 ShutdownWatchdogSec：现代 systemd 只有 RuntimeWatchdogSec /
# RebootWatchdogSec / KExecWatchdogSec 三个（man 5 systemd-system.conf
# "HARDWARE WATCHDOG"）。关机第一阶段仍由 RuntimeWatchdogSec 守护；若要让
# 关机整体有上限，得给 shutdown.target 设 JobTimeoutSec/JobTimeoutAction。
[Manager]
RuntimeWatchdogSec=30s
# 第二阶段的兜底（PID 1 已被 systemd-shutdown 取代之后）。systemd 默认
# 本来就是 10min，写明只是为了让它随镜像显式存在。
RebootWatchdogSec=60s