# /etc/systemd/system/hive-mihomo.service.d/10-hive-hotspot.conf
# mihomo 起停会改变热点客户端的 DNS 上游与出网路径：
#   - 在跑：热点 dnsmasq 转发到 1053（fake-IP 分流），客户端流量进 TUN；
#   - 没跑（没有配置 / 已停用 / 崩溃）：dnsmasq 回退公共 DNS，客户端靠 SNAT 直连。
# ExecStartPost 等 DNS 端口就绪（--wait），ExecStopPost 立即回退。
# || true：热点侧失败绝不能把 mihomo 判成启动失败。
[Service]
ExecStartPost=/bin/sh -c '/usr/local/bin/hive-hotspot-dns.sh --wait || true'
ExecStartPost=/bin/sh -c '/usr/local/bin/hive-hotspot-firewall.sh || true'
ExecStopPost=/bin/sh -c '/usr/local/bin/hive-hotspot-dns.sh || true'
ExecStopPost=/bin/sh -c '/usr/local/bin/hive-hotspot-firewall.sh || true'
