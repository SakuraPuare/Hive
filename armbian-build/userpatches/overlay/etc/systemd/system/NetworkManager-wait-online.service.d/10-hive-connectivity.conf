# Hive: 让 network-online.target 真正代表"已经连上网"。
# Debian/Armbian 默认的 ExecStart 是 `nm-online -s -q`：-s 只等 NetworkManager
# 启动完成（至少一次 state change），不等拿到地址/连通性。于是 hive 各单元里的
# After=network-online.target 形同虚设——实测 provision-node 在 boot+4s 就开始
# "Waiting for network (1/30)"，frpc/easytier 也同时在没网的情况下启动。
# 这里改成等实际连通性：连上立刻返回；完全没网时最多等 45s 后失败返回，
# network-online.target 仍算到达，服务不会因此被卡死。
[Service]
ExecStart=
ExecStart=/usr/bin/nm-online -q -t 45
