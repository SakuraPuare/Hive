# nginx2root chain (2026-11): the Linux SCTP send-path UAF is reachable from
# an unprivileged process that can create an AF_INET/SCTP socket. Hive devices
# do not use SCTP, so block module autoload. `install` is honoured by modprobe
# both for manual calls and for the kernel's request_module() path.
install sctp /bin/false
